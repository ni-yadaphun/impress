<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>รายงานประจำวัน สาขา Impress Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#f4f1f8; --glow1:rgba(224,33,138,.10); --glow2:rgba(124,58,237,.10);
  --surface:#fff; --raise:#f7f4fa; --sink:#ece6f2;
  --ink:#1b1428; --mid:#6b6280; --faint:#9a92ac;
  --line:#e9e3f1; --line2:#d8cfe6;

  --pink:#e0218a; --pink2:#f9558f;
  --violet:#7c3aed; --violet2:#a78bfa;
  --cyan:#0891b2; --cyan2:#22d3ee;
  --amber:#f59e0b; --amber2:#fbbf24;

  --good:#059669; --good-soft:#e6f7f0;
  --warn:#c2740a; --warn-soft:#fdf4e5;
  --bad:#e11d48;  --bad-soft:#fdebef;
  --info:#4f46e5; --info-soft:#eceafd;

  --sh-sm:0 1px 2px rgba(40,20,60,.05), 0 4px 14px rgba(40,20,60,.05);
  --sh-md:0 2px 6px rgba(40,20,60,.06), 0 14px 34px rgba(40,20,60,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#130f1c; --glow1:rgba(224,33,138,.16); --glow2:rgba(124,58,237,.18);
  --surface:#1e1829; --raise:#271f35; --sink:#322843;
  --ink:#f3eefa; --mid:#a79cbd; --faint:#7d7294;
  --line:#312741; --line2:#443658;
  --pink:#f9558f; --pink2:#fb7fa9;
  --violet:#a78bfa; --violet2:#c4b5fd;
  --cyan:#22d3ee; --cyan2:#67e8f9;
  --amber:#fbbf24; --amber2:#fcd34d;
  --good:#34d399; --good-soft:#0d2e26;
  --warn:#fbbf24; --warn-soft:#332413;
  --bad:#fb7185;  --bad-soft:#371320;
  --info:#a5b4fc; --info-soft:#1d1b3d;
  --sh-sm:0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.32);
  --sh-md:0 2px 8px rgba(0,0,0,.55), 0 16px 38px rgba(0,0,0,.42);
}}
:root[data-theme="dark"]{
  --ground:#130f1c; --glow1:rgba(224,33,138,.16); --glow2:rgba(124,58,237,.18);
  --surface:#1e1829; --raise:#271f35; --sink:#322843;
  --ink:#f3eefa; --mid:#a79cbd; --faint:#7d7294;
  --line:#312741; --line2:#443658;
  --pink:#f9558f; --pink2:#fb7fa9;
  --violet:#a78bfa; --violet2:#c4b5fd;
  --cyan:#22d3ee; --cyan2:#67e8f9;
  --amber:#fbbf24; --amber2:#fcd34d;
  --good:#34d399; --good-soft:#0d2e26;
  --warn:#fbbf24; --warn-soft:#332413;
  --bad:#fb7185;  --bad-soft:#371320;
  --info:#a5b4fc; --info-soft:#1d1b3d;
  --sh-sm:0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.32);
  --sh-md:0 2px 8px rgba(0,0,0,.55), 0 16px 38px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-size:15px; line-height:1.62;
  font-family:'Noto Sans Thai','Sarabun',Tahoma,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(760px 420px at 8% -4%, var(--glow1), transparent 62%),
    radial-gradient(680px 460px at 96% 2%, var(--glow2), transparent 60%),
    var(--ground);
  background-attachment:fixed;
}
.dsp{font-family:'Prompt','Noto Sans Thai','Sarabun',Tahoma,sans-serif}
.num{font-family:'Prompt',sans-serif;font-variant-numeric:tabular-nums;font-weight:600}

/* ══ shell ══ */
.shell{display:flex; min-height:100%}

/* ══ sidebar ══ */
aside{
  width:250px; flex:none; position:fixed; inset:0 auto 0 0; z-index:60;
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.logo{padding:20px 20px 16px; display:flex; gap:11px; align-items:center}
.logo .mk{width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--pink2),var(--pink));
  box-shadow:0 6px 16px -4px rgba(224,33,138,.55);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px}
.logo .tx{min-width:0}
.logo .t1{font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.logo .t2{font-size:11.5px;color:var(--faint)}
.snav{flex:1; overflow-y:auto; padding:4px 12px 18px}
.slab{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.09em;
  padding:16px 10px 7px; text-transform:uppercase}
.snav button{
  width:100%; display:flex; gap:11px; align-items:center; text-align:left;
  appearance:none; border:0; background:none; cursor:pointer; color:var(--mid);
  font-family:inherit; font-size:14px; font-weight:500; padding:9px 11px;
  border-radius:10px; margin-bottom:1px; position:relative; transition:background .14s,color .14s;
}
.snav button:hover{background:var(--raise); color:var(--ink)}
.snav button:focus-visible{outline:2px solid var(--pink); outline-offset:-2px}
.snav button[aria-current="page"]{
  color:#fff; font-weight:600;
  background:linear-gradient(135deg,var(--pink2),var(--pink));
  box-shadow:0 7px 18px -6px rgba(224,33,138,.6);
}
.snav button[aria-current="page"] .ico{color:#fff}
.snav button[aria-current="page"] .cnt{background:rgba(255,255,255,.26); color:#fff}
.ico{width:17px;height:17px;flex:none;color:var(--faint)}
.snav button:hover .ico{color:var(--ink)}
.slbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;
  background:var(--sink); color:var(--mid); flex:none}
.av{width:23px;height:23px;border-radius:8px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:700;color:#fff;font-family:'Prompt',sans-serif}

/* ══ main ══ */
.main{flex:1; min-width:0; margin-left:250px}
.topbar{position:sticky; top:0; z-index:40; display:flex; gap:12px; align-items:center;
  padding:14px 26px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.burger{display:none; appearance:none; border:1px solid var(--line2); background:var(--surface);
  width:38px;height:38px;border-radius:11px;cursor:pointer;color:var(--ink);
  align-items:center;justify-content:center;flex:none}
.tb-t{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tb-s{font-size:12px;color:var(--mid)}
.tb-r{margin-left:auto;font-size:12px;color:var(--mid);text-align:right;line-height:1.45}
.wrap{padding:22px 26px 70px; max-width:1240px}
@media (max-width:980px){
  aside{transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--sh-md)}
  aside.open{transform:none}
  .main{margin-left:0}
  .burger{display:flex}
  .topbar{padding-left:16px;padding-right:16px}
  .wrap{padding:18px 16px 70px}
  .scrim{position:fixed;inset:0;background:rgba(20,10,30,.42);z-index:50;backdrop-filter:blur(2px)}
}
@media (prefers-reduced-motion:reduce){ aside{transition:none} }

/* ══ page head ══ */
h1.ph{font-size:23px;font-weight:700;margin:0 0 5px;letter-spacing:-.02em;text-wrap:balance}
p.pd{font-size:14px;color:var(--mid);margin:0 0 20px;max-width:70ch}

/* ══ gradient stat tiles ══ */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-bottom:20px}
.tile{position:relative;border-radius:20px;padding:18px 14px 16px;color:#fff;overflow:hidden;
  isolation:isolate;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px}
.tile::after{content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(120% 90% at 50% -14%,rgba(255,255,255,.34),rgba(255,255,255,0) 58%)}
.tile .gauge{filter:drop-shadow(0 3px 7px rgba(0,0,0,.16))}
.tile .gauge text.gv{font-family:'Prompt',sans-serif;font-weight:700;fill:#fff}
.tile .gauge text.gs{font-family:'Noto Sans Thai',sans-serif;fill:rgba(255,255,255,.88)}
.tile.p{background:linear-gradient(135deg,var(--pink2),var(--pink));
  box-shadow:0 14px 30px -12px rgba(224,33,138,.65)}
.tile.v{background:linear-gradient(135deg,var(--violet2),var(--violet));
  box-shadow:0 14px 30px -12px rgba(124,58,237,.6)}
.tile.c{background:linear-gradient(135deg,var(--cyan2),var(--cyan));
  box-shadow:0 14px 30px -12px rgba(8,145,178,.55)}
.tile.a{background:linear-gradient(135deg,var(--amber2),var(--amber));
  box-shadow:0 14px 30px -12px rgba(245,158,11,.55)}
.tile .tk{font-size:13px;font-weight:600;opacity:.97;line-height:1.35}
.tile .ts{font-size:11.5px;opacity:.88;line-height:1.4}

/* ══ panels ══ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;
  padding:19px 20px;box-shadow:var(--sh-sm);margin-bottom:15px}
.panel>h2{font-size:16.5px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.panel>.cap{font-size:13px;color:var(--mid);margin:0 0 15px;max-width:72ch}
.g2{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;align-items:start}
@media (max-width:900px){.g2{grid-template-columns:1fr}}

/* ══ notes ══ */
.note{border-radius:13px;padding:13px 16px;font-size:13.5px;margin:12px 0;
  border:1px solid transparent}
.note b{display:block;font-size:14.5px;margin-bottom:3px}
.note.p{background:linear-gradient(135deg,rgba(224,33,138,.09),rgba(224,33,138,.04));
  border-color:rgba(224,33,138,.22)}
.note.b{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.note.w{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.note.g{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 26%,transparent)}
.note.i{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.note.v{background:var(--info-soft);border-color:color-mix(in srgb,var(--violet) 30%,transparent)}

/* ══ expandable category ══ */
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  margin-bottom:10px;box-shadow:var(--sh-sm);overflow:hidden}
details.cat[open]{border-color:var(--line2);box-shadow:var(--sh-md)}
summary.ch{list-style:none;cursor:pointer;padding:15px 17px;display:flex;gap:13px;align-items:center}
summary.ch::-webkit-details-marker{display:none}
summary.ch:hover{background:var(--raise)}
summary.ch:focus-visible{outline:2px solid var(--pink);outline-offset:-3px}
.chev{flex:none;width:16px;height:16px;color:var(--faint);transition:transform .16s}
details[open] .chev{transform:rotate(90deg)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.cbody{flex:1;min-width:0}
.ctitle{display:block;font-size:15px;font-weight:600;letter-spacing:-.005em}
.cdesc{display:block;font-size:12.5px;color:var(--mid);margin-top:1px}
.cright{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ccount{font-size:20px;letter-spacing:-.02em}
.detail{padding:6px 17px 17px;border-top:1px solid var(--line);background:var(--raise)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--mid);padding:13px 0 3px}
.meta b{color:var(--ink);font-weight:600}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 15px;margin-top:9px}
.qh{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--faint);
  margin-bottom:4px;flex-wrap:wrap}
.qh .qn{font-weight:700;color:var(--ink);font-size:13px}
.qt{font-size:13.5px;line-height:1.62;white-space:pre-wrap;overflow-wrap:break-word}

/* ══ pills ══ */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;
  font-weight:600;white-space:nowrap;line-height:1.6}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.pill.i{background:var(--info-soft);color:var(--info)}
.pill.n{background:var(--sink);color:var(--mid)}
.pill.p{background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff;
  box-shadow:0 4px 11px -4px rgba(224,33,138,.6)}

/* ══ table ══ */
.scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
th{font-size:11.5px;font-weight:700;color:var(--faint);text-align:right;padding:0 9px 9px;
  border-bottom:1px solid var(--line2);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--raise)}
td.who{font-weight:600}
tr.grp td{background:var(--raise);font-size:11.5px;color:var(--mid);font-weight:700;
  text-align:left;padding:7px 9px;letter-spacing:.03em}
.track{display:inline-block;width:62px;height:7px;border-radius:99px;background:var(--sink);
  overflow:hidden;vertical-align:middle;margin-right:8px}
.track i{display:block;height:100%;border-radius:99px}
.lnk{appearance:none;border:0;background:none;font-family:inherit;font-size:inherit;
  font-weight:600;color:var(--pink);cursor:pointer;padding:0;text-decoration:underline;
  text-underline-offset:2.5px;text-decoration-thickness:1.5px}
.lnk:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:3px}

/* ══ rings ══ */
.ringrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rw{text-align:center;min-width:86px}
.rw .rl{font-size:11.5px;color:var(--faint);margin-top:5px}
.ring text.rv{font-family:'Prompt',sans-serif;font-weight:700;fill:var(--ink)}
.ring text.rs{font-family:'Noto Sans Thai',sans-serif;fill:var(--mid)}

/* ══ comparison matrix ══ */
.mx{display:grid;gap:0;border:1px solid var(--line);border-radius:17px;overflow:hidden;
  background:var(--surface);box-shadow:var(--sh-sm);
  grid-template-columns:152px repeat(3,minmax(0,1fr))}
.mx{max-width:100%}
.mx svg{max-width:100%;height:auto}
.mx>div{padding:15px 12px;border-bottom:1px solid var(--line);min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mx>div.rowlab{align-items:flex-start;justify-content:center;text-align:left;
  background:var(--raise);border-right:1px solid var(--line)}
.mx>div.pcol{background:color-mix(in srgb,var(--pc) 7%,var(--surface));
  border-left:1.5px solid color-mix(in srgb,var(--pc) 26%,transparent)}
.mx>div.pcol:nth-child(4n+2){border-left:0}
.mx>div.mxhead.pcol{
  background:linear-gradient(172deg,color-mix(in srgb,var(--pc) 22%,var(--surface)),
    color-mix(in srgb,var(--pc) 7%,var(--surface)));
  border-bottom:2px solid color-mix(in srgb,var(--pc) 42%,transparent)}
.mxhead .mnm{color:var(--pc)}
.mx>div:nth-last-child(-n+4){border-bottom:0}
.rowlab .rt{font-size:13.5px;font-weight:700;line-height:1.35}
.rowlab .rd{font-size:11.5px;color:var(--mid);margin-top:2px;line-height:1.4}
.mxhead{background:linear-gradient(160deg,var(--raise),var(--surface));gap:7px}
.mxhead .mav{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:20px;font-weight:700;font-family:'Prompt',sans-serif}
.mxhead .mnm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.mxhead .mdt{font-size:11px;color:var(--faint);line-height:1.45}
.mxwin{font-size:11px;font-weight:700;color:var(--good)}
@media (max-width:760px){
  .mx{grid-template-columns:1fr 1fr 1fr}
  .mx>div.rowlab{grid-column:1/-1;align-items:center;text-align:center;
    border-right:0;padding:11px 12px;background:var(--sink)}
  .mx>div.pcol:nth-child(4n+2){border-left:0}
  .mx>div.pcol{padding:13px 4px}
  .mx .ring{width:74px;height:74px}
  .mxhead .mav{width:38px;height:38px;border-radius:11px;font-size:17px}
  .mxhead .mnm{font-size:14px}
  .mxhead .mdt{font-size:10px}
  .mxwin{font-size:10px;line-height:1.3}
}
@media (max-width:400px){
  .mx>div.pcol{padding:11px 2px}
  .mx .ring{width:66px;height:66px}
}

/* ══ person header ══ *//* ══ person header ══ */
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:17px;
  padding:19px 20px;box-shadow:var(--sh-sm);margin-bottom:16px}
.pav{width:58px;height:58px;border-radius:17px;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:24px;font-weight:700;font-family:'Prompt',sans-serif}
.pmeta{flex:1;min-width:190px}
.pname{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.psub{font-size:13px;color:var(--mid);margin-top:2px}
.pbadges{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}

.mix{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:170px}
.lg{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:13px}
.lg .sw{width:11px;height:11px;border-radius:4px;flex:none}
.lg .lt{flex:1;color:var(--mid)}
.lg .lv{font-weight:700}

.rowline{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rowline:last-child{border-bottom:0}
.rowline .rl{flex:1;color:var(--mid)}
.rowline .rv{font-weight:700;flex:none}

.logentry{border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:9px;
  background:var(--surface)}
.lh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.lh .ld{font-weight:700;font-size:13.5px}
.fld{font-size:13px;margin:7px 0;padding-left:11px;border-left:2px solid var(--line2)}
.fld b{display:block;font-size:11px;color:var(--faint);font-weight:700;margin-bottom:1px}
.ledger{margin-top:4px}
.ldg{display:flex;align-items:baseline;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--line)}
.ldg:last-child{border-bottom:0}
.ldg .lop{width:16px;flex:none;text-align:center;font-weight:700;color:var(--faint)}
.ldg .llb{flex:1;min-width:0;font-size:13.5px}
.ldg .llb i{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:1px}
.ldg .lvl{font-weight:700;font-size:15px;white-space:nowrap}
.ldg.sum{background:color-mix(in srgb,var(--violet) 7%,transparent);
  border-radius:9px;padding:9px 11px;margin:4px 0;border-bottom:0}
.ldg.sum .lvl{color:var(--violet)}
.ldg.got .lvl{color:var(--good)}
.ldg.gap .lvl{color:var(--bad)}
.fld.lock{border-left-color:var(--amber)}
.lockmsg{display:block;color:var(--mid);font-style:italic}
.rqrow{border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:9px;
  background:var(--surface)}
.rqrow.open{border-left:3px solid var(--bad)}
.rqrow.fixed{border-left:3px solid var(--good);opacity:.72}
.rqh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rqn{font-size:15.5px;font-weight:700;flex:1;min-width:150px}
.rqd{font-size:12.5px;color:var(--faint);margin-top:2px;width:100%}

ข้าวมากินที่ร้าน","fixed":true},{"name":"กวาง","date":"2026-07-07","text":"เปลี่ยนประตูหลังร้านค่ะ","fixed":false},{"name":"กวาง","date":"2026-07-06","text":"อยากให้เร่งช่างมาเปลี่ยนประตู้ค่ะ","fixed":true},{"name":"กวาง","date":"2026-07-04","text":"ประตูหลังร้านค่ะ อยากให้มาเปลี่ยนไวๆ เพราะว่า ต้องใช้เข้าออกประตูหลังร้านเวลาของมาส่ง ไปเปิดต้องคอยระวังค่ะ จะเริ่มล็อคยากแล้ว เพราะประตูมันบิดค่ะ","fixed":true},{"name":"กวาง","date":"2026-06-28","text":"ปัญหาตอนนี้คือ เครื่องปริ้นใบเสร็จค่ะ ช่วงนี้ ชอบมีปัญหาบ่อยๆ มาที่กระดาษติด ปิดแล้วเครื่องไม่ทำงานค่ะ ต้องใช้แรงปิดแรงๆ ถึงจะได้. และท่อน้ำแอร์หยดค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-26","text":"1 ลมพัดประตู กระจกหลัง Store ไปกระแทกกับลาว จับข้างนอก ทำให้กระจกแตก. 2 ไฟส่องเมนู รู้สึกว่าไฟมัน แสง ส่องตา ก็เลยปรับค่ะ ทำให้ตรงข้างล่าง เครื่องกาแฟ มีความมืดนิดหน่อยค่ะ ไม่สว่างมาก แต่ก็สามารถทำงานได้ 3 ถังขยะสำหรับทิ้ง ถุงหลอดค่ะ ลูกค้าบางคนไม่รู้ว่าขยะอยู่ตรงไหน ส่วนมากจะยื่นมาให้แคชเชียร์ ฝากทิ้ง ถ้ามีขยะอยู่ตรงข้างหน้า แคชเชียร์ ก็น่าจะดีค่ะ แต่จะไม่สวยงาม","fixed":false},{"name":"กวาง","date":"2026-06-19","text":"ปัญหาวันนี้คือ ฝนตก น้ำเข้าร้านค่ะเข้าเยอะกว่าทุกรอบด้วยอีกอย่างวันนี้ฝนก็ตกแรง และน้ำเข้าทุกทางหลัง Store น้ำไหลไปทั่วล็อคเกอร์เลยค่ะสงสัยจะเป็นสนิมแน่ๆ น้ำมันเข้าทางข้างล่าง ตรงประตูและข้างบนที่หยดลงมา จดลงมาตรงปลั๊กไฟด้วยค่ะที่เป็นตู้ไฟแล้วก็ตรงแอร์ และมีข้างหน้าตรงที่เป็นโต๊ะนั่งขายอีกจุดนึง","fixed":false},{"name":"กวาง","date":"2026-06-17","text":"วันนี้มีช่างมาทำประตูอัตโนมัติ เหมือนมารีเซ็ตใหม่ค่ะ แล้วก็ปรับระดับให้มันขึ้น ที่มันเป็นแบบนั้นคือมันติดเหล็ก ตอนนี้น่าจะหายแล้ว รอดูต่อไปค่ะ และมีช่างมา พ่น กำจัดมด ปลวก เขาบอกว่ามันจะหายไปเลย แต่เขาจะมาซ้ำอีก 3 เดือน 1 ครั้ง เท่ากับ 1 ปี 4 ครั้ง ค่ะ เขาบอกว่ามันไม่อันตราย ต่อคนและสัตว์ เขาจะพูดและปากลงดิน การฝากโรงเรียนเขาบอกว่าจะปักห่างกันประมาณ 1 เม็ด รอบร้านกาแฟค่ะ แล้วก็มีพ่นด้วย เข้าไปพวกข้างในร้านด้วยค่ะ แต่ว่าคนไม่เยอะ แล้วเรื่องที่ผมติดขนมค่ะ ตอนนั้นน้องแตนเป็นคนเห็น เพื่อนก็ออกมากำลังจะอุ่น เห็นเส้นผมเลยถ่ายไปให้พี่นิดูตามรูปค่ะ อีกเรื่องหนึ่งที่จะถาม กรณีที่เราเพิ่มน้ำผึ้ง หรือมะนาวให้ลูกค้า แบบนี้เราไม่ได้คิดเงินเพิ่มกับลูกค้าใช่ไหมคะ เพราะวันนี้ลูกค้าถามมาราคาเดิมหรอ ก็ตอบไปว่","fixed":true}]},{"label":"สัตว์รบกวน","desc":"มด แมลงวัน และสัตว์อื่นในพื้นที่ทำงาน","total":12,"people":2,"who":{"กวาง":8,"แตน":4},"first":"2026-06-11","last":"2026-07-09","everFixed":true,"fixedOn":"2026-06-14","recurred":true,"items":[{"name":"กวาง","date":"2026-07-09","text":"1.ประตูหลังบ้าน 2.นำเข้าร้านตอนฝนตก 3.แมลงวัน 4.ลูกค้านำข้าวมากินที่ร้าน","fixed":true},{"name":"แตน","date":"2026-06-27","text":"เรื่องมด มดหายสนิทค่ะ ไม่มีมาแล้ว","fixed":false},{"name":"แตน","date":"2026-06-25","text":"มดไม่มีแล้ว เรายังต้องแร็ปพวกไซรัปไหมคะ หรือว่าไม่ต้องแร็ปก็ได้","fixed":true},{"name":"กวาง","date":"2026-06-17","text":"วันนี้มีช่างมาทำประตูอัตโนมัติ เหมือนมารีเซ็ตใหม่ค่ะ แล้วก็ปรับระดับให้มันขึ้น ที่มันเป็นแบบนั้นคือมันติดเหล็ก ตอนนี้น่าจะหายแล้ว รอดูต่อไปค่ะ และมีช่างมา พ่น กำจัดมด ปลวก เขาบอกว่ามันจะหายไปเลย แต่เขาจะมาซ้ำอีก 3 เดือน 1 ครั้ง เท่ากับ 1 ปี 4 ครั้ง ค่ะ เขาบอกว่ามันไม่อันตราย ต่อคนและสัตว์ เขาจะพูดและปากลงดิน การฝากโรงเรียนเขาบอกว่าจะปักห่างกันประมาณ 1 เม็ด รอบร้านกาแฟค่ะ แล้วก็มีพ่นด้วย เข้าไปพวกข้างในร้านด้วยค่ะ แต่ว่าคนไม่เยอะ แล้วเรื่องที่ผมติดขนมค่ะ ตอนนั้นน้องแตนเป็นคนเห็น เพื่อนก็ออกมากำลังจะอุ่น เห็นเส้นผมเลยถ่ายไปให้พี่นิดูตามรูปค่ะ อีกเรื่องหนึ่งที่จะถาม กรณีที่เราเพิ่มน้ำผึ้ง หรือมะนาวให้ลูกค้า แบบนี้เราไม่ได้คิดเงินเพิ่มกับลูกค้าใช่ไหมคะ เพราะวันนี้ลูกค้าถามมาราคาเดิมหรอ ก็ตอบไปว่","fixed":true},{"name":"กวาง","date":"2026-06-16","text":"ปัญหาก็ยังเป็นหมดเหมือนเดิม จะรู้สึกว่าน้อยลง มากๆ มีไม่เยอะ ตั้งแต่เอาขวดไซรัปน้ำผึ้ง ไปตั้งใส่ถาดที่มีน้ำตลอดเวลา มดไม่มาเลยค่ะ มาแต่น้อย ไม่เยอะมาก แต่ว่าน้ำในถาดเปลี่ยนทุกวัน ค่ะ","fixed":true},{"name":"กวาง","date":"2026-06-15","text":"อุปสรรคในการทำงานก็จะเป็นเรื่องเดิมคือเรื่องมด แต่ไม่เยอะ มาก แต่ก็ยังมีอยู่ ได้คอยระวังกลัวลงไปในเครื่องดื่มลูกค้า ทางเดินของมดมาจาก พื้นดิน ปูนข้างล่าง แล้วก็ข้างฝาตรงอ่างล้างมือค่ะ","fixed":false},{"name":"แตน","date":"2026-06-14","text":"วันนี้ลูกค้าสั่งน้ำ เผือกเย็น แต่กว่าลูกค้าจะทานก็ประมาณ5-10นาทีได้ ลูกค้านั่งด้านนอก ทีนี้สักพักนึง ลูกค้าบอกว่าเปลี่ยนแก้วให้ได้ไหม มีแมลงลง ซึ่งตอนเราทำมันไม่มีอยู่แล้วค่ะ แต่เราก็เปลี่ยนให้ลูกค้าใหม่ อยากรู้ว่าเราควรเปลี่ยนให้ไหมคะ เพราะว่ามันเป็นหน้าที่ของลูกค้าแล้วค่ะ เพราะเราทำให้ไม่ได้มีแมลงลง ลูกค้าไม่วีนนะคะ เพราะส่วนตัวหนูคิดว่า เขาคงรู้ตัวว่าเราไม่ผิด เพราะแมลงลงตอนลูกค้าได้รับไปแล้ว แถมขอบคุณเราด้วย แบบนี้เปลี่ยนไหมคะ ความจริงหนูไม่อยากเปลี่ยนเลยค่ะ(ส่วนตัวค่ะ)","fixed":false},{"name":"กวาง","date":"2026-06-14","text":"1 ไมเรียกคิวค่ะ เวลาลูกค้าเข้ามาร้านเยอะๆ เสียงไม่สู้ลูกค้าจริงๆ 2 เรื่องมดค่ะ แต่วันนี้ดีขึ้นมดไม่เยอะมาก","fixed":true},{"name":"กวาง","date":"2026-06-13","text":"เรื่องมดค่ะ มดเยอะขึ้นทุกวัน วันนี้เยอะกว่าเมื่อวาน มันมาตลอดเลยค่ะ ไม่ว่าจะเป็นข้างหน้าตรงเก้าอี้ที่ลูกค้าทำขนมตกเศษขนม หมดก็มากินเต็มเลยค่ะ เป็นมดสีดำเต็มเลย เป็นอุปสรรคในการทำงานมาก เพราะว่ากลัวมดเข้าไปในเครื่องดื่มลูกค้าค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-12","text":"ปัญหาในการทำงานตอนนี้คือมดค่ะ มันเข้าใจรับระหว่างวัน บีบออกมา มันอยู่ที่ปากไซรัป ได้ทิ้งค่ะ ได้นำไซรัปน้ำผึ้ง ที่มีความหวาน แช่ในน้ำ ตลอดวันเลย วันนี้ซีนไปรับน้ำมากและตั้งแช่ไว้ในน้ำ ลองดูพรุ่งนี้ว่าจะเข้าได้ไหม แต่เมื่อเช้ายังมีเข้าค่ะ แต่กวางเปลี่ยนถาดใหม่ที่เป็นถาดใหญ่และลึก น่าจะเข้าไม่ได้ ตอนนี้มดไปทุกที่เลยค่ะ ไม่ว่าจะเป็นชั้นวางของ เครื่องปั่น ที่เราล้างแล้วไปคว่ำ มดก็ยังขึ้นค่ะ","fixed":false},{"name":"แตน","date":"2026-06-11","text":"มดขึ้นน้ำเชื่อมระหว่างวันค่ะ อยากได้ช่องอะไรก็ได้ยาวๆมาใส่น้ำแล้ววางน้ำเชื่อมค่ะ แต่ตอนนี้ใช้ถาดวางไปก่อน เติมน้ำ มดจะได้ไม่ขึ้น","fixed":false},{"name":"กวาง","date":"2026-06-11","text":"1.อุปสรรคในการทำงาน ตอนนี้ คือมีมดเยอะมาก มดมากับน้ำผึ้งก่อนหน้านี้ที่ยังไม่ได้ใช้น้ำผึ้งเยอะๆ ไม่เห็นหมดเลย แต่พอ เริ่มมีอาโวคาโดปั่นแล้วใช้น้ำผึ้งเยอะ หมดเริ่มมาเยอะเลยค่ะ 2 ปัญหาการคูปอง บางรายการ ไม่ขึ้น ได้ไปลงที่ Voucher เอา ค่ะ","fixed":false}]},{"label":"ของใช้ในร้านไม่พอ","desc":"ช้อน ที่ตวง แก้ว อุปกรณ์ที่ต้องซื้อเพิ่ม","total":7,"people":2,"who":{"แตน":3,"กวาง":4},"first":"2026-06-09","last":"2026-08-21","everFixed":false,"fixedOn":null,"recurred":false,"items":[{"name":"แตน","date":"2026-08-21","text":"ขอที่ตวงนม กับ ที่คีบเพิ่มค่ะ","fixed":false},{"name":"แตน","date":"2026-08-16","text":"ขอที่ตวงนมเพิ่มอีกสัก1ค่ะ","fixed":false},{"name":"กวาง","date":"2026-07-13","text":"อยากได้ที่ตัวดูดฝุ่นใหม่ค่ะ ตอนนี้ใช้เทปไปเอา เหมือนมันแตกแล้วมันหลุด เวลาดูดทำความสะอาด","fixed":false},{"name":"กวาง","date":"2026-06-25","text":"อยากให้มีที่รองขาเก้าอี้ เวลาลูกค้ามา ลูกค้าลากเก้าอี้ดำเนินเสียงดัง ค่ะ มันเป็นเสียงลากก๊อกแก๊กบางทีลูกค้าคนอื่นนั่งอยู่ มันจะเป็น เสียงรบกวนไหมคะหรือว่าไม่ต้องก็ได้ อันนี้อยากเสนอค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-11","text":"อยากเสนอพี่ 1 อยากได้ขวดที่เก็บน้ำผึ้งที่มิดชิด เพราะการเทจากขวด จะง่ายกว่าการปั๊มค่ะ และไม่เสียเวลาด้วย ส่วนขวดปั๊ม สามารถเอามาไว้วาดแก้วได้ค่ะ หรือถ้าดี ก็มีขวดสำหรับราดแก้วของน้ำผึ้งก็ดีค่ะ 2 กล้วย ปั่นค่ะ ลูกค้ามาถามหากล้วยปั่น ประมาณ 2-3 ท่าน คือพระค่ะ 3 กรณีที่ลูกค้า มาขอเพิ่ม เป็นมะนาวเช่น เมนูอเมริกาโน่เย็นมะนาว หรือ น้ำผึ้งแบบนี้กวางเพิ่มให้เลย ก่อนทำถูกต้องไหมคะโดยไม่ต้องคิดเงินกับลูกค้า","fixed":false},{"name":"กวาง","date":"2026-06-10","text":"อยากให้เพิ่มช้อนคนกาแฟแบบเล็กๆอีกสัก4-5 อัน และที่ตวงนมอีกสัก2-3อันค่ะ เพื่อจะได้ไม่รอกันระห่างชง","fixed":false},{"name":"แตน","date":"2026-06-09","text":"อยากได้พื้นที่ในการทำมากกว่านี้ค่ะ จุดวางแก้ว2ที่ จุดวางช้อน ที่ปาด2ที่ อยากได้ที่ตวงนมกับครีมเพิ่มด้วยค่ะ","fixed":false}]},{"label":"เครื่องมือและเครื่องใช้","desc":"เครื่องชง เครื่องปั่น เครื่องพิมพ์ใบเสร็จ","total":7,"people":2,"who":{"กวาง":6,"ตุ๊กตา":1},"first":"2026-06-12","last":"2026-07-18","everFixed":false,"fixedOn":null,"recurred":false,"items":[{"name":"กวาง","date":"2026-07-18","text":"ปัญหาตอนนี้คือถังขยะค่ะ ถังขยะที่อยู่หน้าเคาน์เตอร์สำหรับทิ้งเศษหลอดหรือใบเสร็จ ลูกค้าจะไม่รู้ว่าขยะอยู่ตรงไหน และลูกค้าก็แนะนำมาหลายคนค่ะ ว่าควรมีขยะอยู่ข้างใน ทุกหน้าเคาน์เตอร์","fixed":false},{"name":"กวาง","date":"2026-07-15","text":"1.แอร์ ห้องสโตร์ 2 -20","text":"สิ่งที่ สิ่งที่ทำพลาดวันนี้คือ ทำแก้วแตกค่ะ ที่เป็นแก้ว ML เล็กๆ เขาเรียกว่า แก้ว ดวงยาหรือเปล่าค่ะที่เป็นกลมๆเล็กๆ วันนี้กวางทำแตกค่ะ","fixed":false}]}],"customer":[{"label":"อธิบาย/ตอบคำถามลูกค้า","desc":"ตอบข้อสงสัยเรื่องเมนู ส่วนผสม หรือวิธีทำ","total":14,"people":2,"who":{"กวาง":13,"แตน":1},"first":"2026-06-08","last":"2026-07-18","everFixed":false,"fixedOn":null,"recurred":false,"items":[{"name":"กวาง","date":"2026-07-18","text":"ลูกค้าเดินมาถามว่า ที่นี่มีมัจฉะชาเขียวไหม ตอบลูกค้าไปว่าเป็นมัจฉริยะชาเขียวคะ ลูกค้าบอกว่าเป็นมัชชะ ตอบลูกค้าไปว่ามีค่ะ ลูกค้าบอกว่าเป็นมัจฉาตัวไหน ขอดูหน่อยได้ไหม เลยชี้ไปที่ ซองมัทฉะที่พี่นิติดไว้ให้ลูกค้าดู ลูกค้าต่อว่าโอเคค่ะรับค่ะ","fixed":false},{"name":"กวาง","date":"2026-07-16","text":"ลูกค้าชมว่ามัทฉะที่นี่อร่อยค่ะ ลูกค้าถามว่ามัทฉะมาจากไหนบอกลูกค้าไปว่านำเข้าค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-29","text":"ได้คุยกับลูกค้าลูกค้าได้สอบถามว่า เคยทำงานมาแล้วหรือเปล่าเคยประสบการณ์มาไหม แล้วกับลูกค้าไปว่าแม่เลยค่ะ มาฝึกที่นี่เลย ลูกค้าถามต่อว่าฝึกกี่เดือนล่ะ ได้ตอบลูกค้าไปว่า 2 อาทิตย์ก่อนเปิดร้านเลยค่ะ ลูกค้าถามต่อว่าตอนนี้เป็นยังไงบ้างล่ะ ทำเก่งหรือยัง ตอบลูกค้าไปว่า เริ่มคล่องแล้วค่ะ ลูกค้าถามต่อว่า มีสูตรเลยใช่ไหม ตอบลูกค้าไปว่าใช่ค่ะ เป็นสูตรของลูกศิษย์หลวงพ่อ พี่ที่มาช่วยวันเปิดร้านค่ะ ลูกค้าเลยบอกว่าดีนะ ประมาณนี้ค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-27","text":"ได้คุยกับลูกค้าที่มาประจำและเคยมา ปฏิบัติธรรม ลูกค้าบอกแนะนำให้อยู่นะ ก็ตอบลูกค้าไปว่าขอบค่ะ ลูกค้าบอกว่ากาแฟอร่อยกินแล้วได้บุญด้วย","fixed":false},{"name":"กวาง","date":"2026-06-24","text":"ลูกค้าทักว่ารดต้นไม้เองเลยหรอก ตอบลูกค้าว่าใช่ค่ะ แล้วถามลูกค้าว่าวันนี้รับอะไรดีคะ ลูกค้าสั่งอเมริกาโน่ส้มค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-20","text":"หมดเวลากับลูกค้า ลูกค้าถามว่ากินอะไรดี มีเมนูแนะนำไหม ลูกค้า เป็นผลไม้อันไหนอร่อยก็เลยตอบลูกค้าไปว่าส้มปั่นก็อร่อยนะคะมีอะโวคาโดด้วยค่ะพวกเขาบอกว่าเอาอะโวคาโดค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-17","text":"วันนี้มีช่างมาทำประตูอัตโนมัติ เหมือนมารีเซ็ตใหม่ค่ะ แล้วก็ปรับระดับให้มันขึ้น ที่มันเป็นแบบนั้นคือมันติดเหล็ก ตอนนี้น่าจะหายแล้ว รอดูต่อไปค่ะ และมีช่างมา พ่น กำจัดมด ปลวก เขาบอกว่ามันจะหายไปเลย แต่เขาจะมาซ้ำอีก 3 เดือน 1 ครั้ง เท่ากับ 1 ปี 4 ครั้ง ค่ะ เขาบอกว่ามันไม่อันตราย ต่อคนและสัตว์ เขาจะพูดและปากลงดิน การฝากโรงเรียนเขาบอกว่าจะปักห่างกันประมาณ 1 เม็ด รอบร้านกาแฟค่ะ แล้วก็มีพ่นด้วย เข้าไปพวกข้างในร้านด้วยค่ะ แต่ว่าคนไม่เยอะ แล้วเรื่องที่ผมติดขนมค่ะ ตอนนั้นน้องแตนเป็นคนเห็น เพื่อนก็ออกมากำลังจะอุ่น เห็นเส้นผมเลยถ่ายไปให้พี่นิดูตามรูปค่ะ อีกเรื่องหนึ่งที่จะถาม กรณีที่เราเพิ่มน้ำผึ้ง หรือมะนาวให้ลูกค้า แบบนี้เราไม่ได้คิดเงินเพิ่มกับลูกค้าใช่ไหมคะ เพราะวันนี้ลูกค้าถามมาราคาเดิมหรอ ก็ตอบไปว่","fixed":false},{"name":"กวาง","date":"2026-06-16","text":"บทสนทนากับลูกค้าวันนี้ คุยกับลูกค้าหลายคนมาก แต่จำไม่ได้ว่าพูดอะไร ที่จำได้นะคะ ตอนเย็นเลย มีลูกค้ามา แต่ลูกค้าคนนี้ก็มาบ่อย เข้ามาตอนที่พี่ปุ้มมาแล้วก็รู้จักกับพี่อุ้ม ก็คุยกันค่ะ ลูกค้าก็สั่งอะโวคาโดแม่หวาน กับหวานปกติ ไม่หวานไม่ใส่น้ำผึ้งเลย ลูกค้าบอกว่าไม่กินหวาน และลูกค้าก็ขอเบอร์ไว้เผื่อโทรมาสั่ง ตอนมาเรียนอยู่ที่สถาบัน อยู่ที่ปฏิบัติธรรมค่ะ ลูกค้าบอกว่าเป็นพี่เลี้ยง ที่ปฏิบัติธรรม ตอนแรกว่าจะให้เบอร์ร้าน โทรศัพท์ร้านเปิดเพลงตลอด เลยเอาไลน์กวางให้ บอกลูกค้าว่า ถ้า LINE มาไม่ตอบให้โทรมานะคะ เผื่อติดลูกค้าเยอะ ไม่มีเวลาตอบ ลูกค้าบอกว่าโอเค เข้าใจ ถ้ายังไงจะโทรมาสั่ง ประมาณนี้ค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-15","text":"บทสนทนาที่คุยกับลูกค้า ลูกค้าถามว่า บลูเบอรี่กับสตอเบอรี่อันไหนอร่อยกว่ากัน ก็เลยบอกลูกค้าว่า สำหรับตัวหนู หนูว่าสตอเบอรี่ ลูกค้าก็เลยบอกว่า งั้นเอาสตอเบอรี่ และลูกค้าอีกคนนึง ที่เคยมาซื้อลาเต้ รบกวนก่อนแต่ไม่ได้แยกชั้น มารอบนี้ลูกค้าบอกว่าทำไมสวยจังได้สูตรไหนมาหรอเล็กกับลูกค้าว่าสูตรเดิมค่ะ แค่แยกชั้นเฉยๆเลยดูสวยงาม","fixed":false},{"name":"แตน","date":"2026-06-14","text":"อ่าวันนี้ตอนเลิกงาน ลูกค้าถามว่าข้างในมีที่ทำงานไหมครับ หนูเลยตอบว่า ปิดแล้วค่ะ ลูกค้าถามต่อ พอดีเหมือนอเมซอนไหมครับ หนูบอก นั่งทำงานได้ค่ะมีไวไฟให้ค่ะ ลูกค้าบอกเห็นไหมแล้วก็ยิ้มกัน พรุ่งนี้น่าจะมาใช้บริการค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-13","text":"วันนี้ลูกค้ามาสั่งอะโวคาโดมะพร้าว ลูกค้าถามว่าไม่มีในสูตรใช่ไหม แต่ว่าใช่ค่ะ ลูกค้าจะรับไหมคะจะปั่นให้ ลูกค้าบอกว่ารับ ลูกค้าเคยไปกินที่อื่น เขามีอเมริกาโน่มะพร้าวปั่น ลูกค้าบอกว่าปั่นมาเลยเพื่อสุขภาพจะลองชิม ก็เลยปั่นเป็นอะโวคาโดน้ำมะพร้าว ไม่ใส่เนื้อมะพร้าวให้ลูกค้า ลูกค้าชิม ลูกค้าบอกว่าอร่อยดี ค่ะ และมีลูกค้าใหม่มาวันนี้ถามว่าเมนูอะไรอร่อย เลยถามกับลูกค้าว่าลูกค้ากินกาแฟไหมคะ ลูกค้าบอกว่ากาแฟก็ได้เลยแนะนำ impress Coffee ไป ลูกค้ากินแล้วถามลูกค้าว่าเป็นยังไงบ้างคะ ลูกค้าตอบว่า อร่อย พอดี ความหวานพอดี เลยบอกลูกค้าไปว่ารอบหน้าลูกค้ามาสั่งเป็นหวานน้อยได้นะคะ","fixed":false},{"name":"กวาง","date":"2026-06-12","text":"1.วันนี้มีลูกค้ามา สั่ง อะโวคาโดปั่นไม่ไหวไม่ใส่น้ำผึ้งทำให้ลูกค้าโดยใส่แค่มันสดกับครีม ซึ่งลูกค้าเป็นคนที่มาทานหวานลูกค้าบอกว่าอร่อย เหมือนที่เราไม่ได้ถามลูกค้าขนาดไม่ใส่น้ำตาลเลยยังอร่อย 2\\. ลูกค้าที่มากิน impress Coffee ร้อนประจำ วันนี้ลูกค้าไม่ได้เอาแก้วมาด้วยเลยถามลูกค้าว่าลูกค้าได้เอาแก้วมาไหมคะปกติลูกค้าจะนำมาทุกวันลูกค้าต่อว่าไม่พอทำเสร็จทำลูกค้าอีกครั้งว่าลูกค้าเติมน้ำมันเหมือนเดิมไหมคะลูกค้าต่อว่าเติมค่ะ 3\\. วันนี้มีลูกค้าใหม่มา น่าจะมาสุราษฎร์ตอนเช้าแล้วแวะมาร้านกาแฟประมาณ 4-5 ท่านได้คุยกับลูกค้าลูกค้าบอกว่าไม่รู้ว่าวันเปิด เปิดมานานหรือยัง ตอบลูกค้าว่าขึ้นวันที่ 24 ที่ผ่านมาค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-10","text":"ถามลูกค้าว่ารับอะไรดีค่ะ สวัสดีทักทายลูกค้า ลูกค้าถามซื้อน้ำแข็งเปล่าแก้ว ตอบลูกค้าไปว่าไม่มี เราไม่ได้ขาย ลูกค้าถามกาแฟขั่วอะไร ตอบลูกค้าว่สขั่วกลาง ลูกค้าถามว่าเลือกขั่วกาแฟได้ไหม ตอบลูกค้าว่ามีแค่ขั่วกลาง","fixed":false},{"name":"กวาง","date":"2026-06-08","text":"ลูกค้าถามเมนูปั่นว่าผลไม้สดไหม ตอบลูกค้าว่าผลไม้สดแช่ฟรีซค่ะ","fixed":false}]},{"label":"รับมือคำติ/ข้อร้องเรียน","desc":"ลูกค้าไม่พอใจ ขอเปลี่ยน หรือติชมรสชาติ","total":4,"people":2,"who":{"กวาง":2,"แตน":2},"first":"2026-06-08","last":"2026-06-25","everFixed":false,"fixedOn":null,"recurred":false,"items":[{"name":"กวาง","date":"2026-06-25","text":"วันนี้มีลูกค้ามา ลูกค้าเคยมาวันเปิด ลูกค้าได้สั่งเอสเพรสโซ่เพิ่มหวานไปกินกับพายก็เลยถามลูกค้าว่าเป็นยังไงบ้างคะกาแฟอร่อยไหมคะ รสชาติได้ไหมลูกค้ายกมือเยี่ยมให้แล้วรู้เขาว่าอร่อยๆ ดีเลยขนมก็อร่อย ค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-15","text":"ขันติชมจากลูกค้าวันนี้เหมือนจะไม่มี เพราะลูกค้าไม่เยอะ ไม่มีลูกค้าติดหรือชมอะไร แต่จะมีแค่ แม่ค้าที่จะติดลูกค้า เพราะลูกค้า นำอาหารเข้ามากิน ไม่รู้จะบอกยังไง ลูกค้านั่งๆกินอยู่ก็ไม่กล้าเดินไปบอก แต่ก็ไม่ได้เยอะอะไรมากมาย แค่จบถ้วยเดียว ค่ะ","fixed":false},{"name":"แตน","date":"2026-06-14","text":"วันนี้ลูกค้าสั่งน้ำ เผือกเย็น แต่กว่าลูกค้าจะทานก็ประมาณ5-10นาทีได้ ลูกค้านั่งด้านนอก ทีนี้สักพักนึง ลูกค้าบอกว่าเปลี่ยนแก้วให้ได้ไหม มีแมลงลง ซึ่งตอนเราทำมันไม่มีอยู่แล้วค่ะ แต่เราก็เปลี่ยนให้ลูกค้าใหม่ อยากรู้ว่าเราควรเปลี่ยนให้ไหมคะ เพราะว่ามันเป็นหน้าที่ของลูกค้าแล้วค่ะ เพราะเราทำให้ไม่ได้มีแมลงลง ลูกค้าไม่วีนนะคะ เพราะส่วนตัวหนูคิดว่า เขาคงรู้ตัวว่าเราไม่ผิด เพราะแมลงลงตอนลูกค้าได้รับไปแล้ว แถมขอบคุณเราด้วย แบบนี้เปลี่ยนไหมคะ ความจริงหนูไม่อยากเปลี่ยนเลยค่ะ(ส่วนตัวค่ะ)","fixed":false},{"name":"แตน","date":"2026-06-08","text":"บางเมนูกาแฟเข้มไปก็จะขอเพิ่มน้ำ เพิ่มไซรัป มะพร้าวปั่นถ้าไม่ใส่ไซรัปจะจืดเลย ถ้าเอาแต่ความหวานจากน้ำมะพร้าว","fixed":false}]},{"label":"สถานการณ์ที่ตัดสินใจยาก","desc":"เรื่องที่ไม่มีนโยบายรองรับ ต้องตัดสินใจเองหน้างาน","total":3,"people":2,"who":{"กวาง":2,"แตน":1},"first":"2026-06-11","last":"2026-06-15","everFixed":false,"fixedOn":null,"recurred":false,"items":[{"name":"กวาง","date":"2026-06-15","text":"ขันติชมจากลูกค้าวันนี้เหมือนจะไม่มี เพราะลูกค้าไม่เยอะ ไม่มีลูกค้าติดหรือชมอะไร แต่จะมีแค่ แม่ค้าที่จะติดลูกค้า เพราะลูกค้า นำอาหารเข้ามากิน ไม่รู้จะบอกยังไง ลูกค้านั่งๆกินอยู่ก็ไม่กล้าเดินไปบอก แต่ก็ไม่ได้เยอะอะไรมากมาย แค่จบถ้วยเดียว ค่ะ","fixed":false},{"name":"แตน","date":"2026-06-15","text":"ลูกค้าชอบนำอาหารมาทานค่ะ ป้ายก็มีติด บางทีหันไปมองอีกทีก็กินกันแล้ว ไม่กล้าจะไปบอกกันค่ะ แบบนี้จะเพิ่มขยะให้ร้านเราค่ะ ไม่ค่อยโอเคเลยค่า","fixed":false},{"name":"กวาง","date":"2026-06-11","text":"อยากเสนอพี่ 1 อยากได้ขวดที่เก็บน้ำผึ้งที่มิดชิด เพราะการเทจากขวด จะง่ายกว่าการปั๊มค่ะ และไม่เสียเวลาด้วย ส่วนขวดปั๊ม สามารถเอามาไว้วาดแก้วได้ค่ะ หรือถ้าดี ก็มีขวดสำหรับราดแก้วของน้ำผึ้งก็ดีค่ะ 2 กล้วย ปั่นค่ะ ลูกค้ามาถามหากล้วยปั่น ประมาณ 2-3 ท่าน คือพระค่ะ 3 กรณีที่ลูกค้า มาขอเพิ่ม เป็นมะนาวเช่น เมนูอเมริกาโน่เย็นมะนาว หรือ น้ำผึ้งแบบนี้กวางเพิ่มให้เลย ก่อนทำถูกต้องไหมคะโดยไม่ต้องคิดเงินกับลูกค้า","fixed":false}]}],"sales":[{"label":"ถามความเห็นลูกค้าเรื่องรสชาติ","desc":"เข้าไปถามเองว่าอร่อยไหม เพื่อเอามาปรับปรุง","total":22,"people":3,"who":{"แตน":2,"กวาง":15,"อาร์ม":5},"first":"2026-06-08","last":"2026-08-12","everFixed":false,"fixedOn":null,"recurred":false,"items":[{"name":"แตน","date":"2026-08-12","text":"กาแฟอร่อยไหมคะ","fixed":false},{"name":"กวาง","date":"2026-07-20","text":"ลูกค้าซื้อคีโตแล้วกลับมาซื้ออีก ได้ถามลลูกค้าว่าอร่อยไหมคะลูกค้าบอกตอบว่าอร่อยค่ะ","fixed":false},{"name":"แตน","date":"2026-07-10","text":"อิมเพลสรสชาติอร่อยไหมคะ (ลูกค้าไม่เคยทาน) ลูกค้าบอกว่าเย็นแข่ว อร่อยๆ","fixed":false},{"name":"กวาง","date":"2026-07-07","text":"ลูกค้ามาซื้อคีโตลองชิม1ชิ้น กลับมาซื้ออีกถามลูกค้าว่าอร่ยไหม ลูกค้าบอกว่าอร่อยค่ะ","fixed":false},{"name":"กวาง","date":"2026-07-04","text":"ถามลูกค้าว่าเป็นยังไงบ้างค่ะลูก ลูกค้าบอกว่าอร่อย เมนูอะโวคาโดค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-29","text":"ได้คุยกับลูกค้าลูกค้าได้สอบถามว่า เคยทำงานมาแล้วหรือเปล่าเคยประสบการณ์มาไหม แล้วกับลูกค้าไปว่าแม่เลยค่ะ มาฝึกที่นี่เลย ลูกค้าถามต่อว่าฝึกกี่เดือนล่ะ ได้ตอบลูกค้าไปว่า 2 อาทิตย์ก่อนเปิดร้านเลยค่ะ ลูกค้าถามต่อว่าตอนนี้เป็นยังไงบ้างล่ะ ทำเก่งหรือยัง ตอบลูกค้าไปว่า เริ่มคล่องแล้วค่ะ ลูกค้าถามต่อว่า มีสูตรเลยใช่ไหม ตอบลูกค้าไปว่าใช่ค่ะ เป็นสูตรของลูกศิษย์หลวงพ่อ พี่ที่มาช่วยวันเปิดร้านค่ะ ลูกค้าเลยบอกว่าดีนะ ประมาณนี้ค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-25","text":"วันนี้มีลูกค้ามา ลูกค้าเคยมาวันเปิด ลูกค้าได้สั่งเอสเพรสโซ่เพิ่มหวานไปกินกับพายก็เลยถามลูกค้าว่าเป็นยังไงบ้างคะกาแฟอร่อยไหมคะ รสชาติได้ไหมลูกค้ายกมือเยี่ยมให้แล้วรู้เขาว่าอร่อยๆ ดีเลยขนมก็อร่อย ค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-24","text":"ลูกค้าทักว่ารดต้นไม้เองเลยหรอก ตอบลูกค้าว่าใช่ค่ะ แล้วถามลูกค้าว่าวันนี้รับอะไรดีคะ ลูกค้าสั่งอเมริกาโน่ส้มค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-23","text":"ลูกค้า ลูกค้ากลับมาซื้อคีโตรอบที่ 2 ก็เลยถามลูกค้าไปว่า อร่อยไหมคะ ลูกค้าบอกว่าอร่อยค่ะมีพี่คนนึงเขากินขนมที่ไม่มีน้ำตาลเขาเลยชอบค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-19","text":"วันนี้ลูกค้ามาลูกค้าสั่งเป็นอเมริกาโน่ร้อน แล้วทำต่อว่า เมนูไหนอร่อย เลยถามลูกค้าว่าลูกค้าทานเป็นกาแฟไหมคะ หรือเป็นมัจฉาดีมัจฉาลูกค้าทำมัจฉาอะไรอร่อย ก็เลยแนะนำลูกค้ามัจฉาน้ำส้มก็อร่อยนะคะ ลูกค้าก็เลยบอกว่าเอามัทฉะน้ำส้มค่ะ","fixed":false},{"name":"กวาง","date":"2026-06-17","text":"วันนี้จะถามลูกค้า รสชาติกาแฟเป็นยังไงบ้างคะ ลูกค้ายังไม่เคยมา ลูกค้าอยู่หมู่บ้านใกล้ๆวัด ลูกค้ามาตอนเช้า 2 คน แต่ผู้หญิงเคยมาแล้ว วันเปิดร้านคนเยอะมากแล้วลูกค้ามาวันนี้ ผู้ชายสั่งอเมริกาโน่ร้อน ใส่น้ำผึ้ง แล้วก็ใส่มะนาวด้วยได้ไหม กวางก็ใส่ให้ค่ะ แล้วก็ถามลูกค้าว่า เป็นยังไงบ้างคะ รสชาติกาแฟ ลูกค้าบอกว่า ว่าโอเคเลย รสชาตินี้ใช่เลย จะได้มาซื้อบ่อยๆ ได้บอกลูกค้าว่า กินกาแฟได้บุญด้วยนะคะ ลูกค้าบอกใช่ๆจะได้มาอุดหนุนบ่อยๆประมาณนี้ค่ะ","fixed":false},{"name":"อาร์ม","date":"2026-06-17","text":"รสชาติเป็นไงบ้างครับเหมือนเดิมไหม","fixed":false},{"name":"อาร์ม","date":"2026-06-16","text":"รสชาติเป็นไงบ้างคับ อร่อยไหม","fixed":false},{"name":"กวาง","date":"2026-06-14","text":"ถามลูกค้าว่ารับเหมือนเดิมไหมคะ เป็นลูกค้าคนแรกของวันและหลังจ่กนั้นก็ำม่มีเวล่ถามลูกค้าอีกเลย","fixed":false},{"name":"กวาง","date":"2026-06-13","text":"วันนี้ลูกค้ามาสั่งอะโวคาโดมะพร้าว ลูกค้าถามว่าไม่มีในสูตรใช่ไหม แต่ว่าใช่ค่ะ ลูกค้าจะรับไหมคะจะปั่นให้ ลูกค้าบอกว่ารับ ลูกค้าเคยไปกินที่อื่น เขามีอเมริกาโน่มะพร้าวปั่น ลูกค้าบอกว่าปั่นมาเลยเพื่อสุขภาพจะลองชิม ก็เลยปั่นเป็นอะโวคาโดน้ำมะพร้าว ไม่ใส่เนื้อมะพร้าวให้ลูกค้า ลูกค้าชิม ลูกค้าบอกว่าอร่อยดี ค่ะ และมีลูกค้าใหม่มาวันนี้ถามว่าเมนูอะไรอร่อย เลยถามกับลูกค้าว่าลูกค้ากินกาแฟไหมคะ ลูกค้าบอกว่ากาแฟก็ได้เลยแนะนำ impress Coffee ไป ลูกค้ากินแล้วถามลูกค้าว่าเป็นยังไงบ้างคะ ลูกค้าตอบว่า อร่อย พอดี ความหวานพอดี เลยบอกลูกค้าไปว่ารอบหน้าลูกค้ามาสั่งเป็นหวานน้อยได้นะค }

  [["sum","ภาพรวม",null],["open","ปัญหารอการแก้ไข",null],
   ["req","ของที่น้องขอ",null],
   ["system","ระบบและโครงสร้าง",sumOf("system")],
   ["person","ความผิดพลาดของคน",sumOf("person")],
   ["customer","การรับมือลูกค้า",sumOf("customer")],
   ["sales","ความอยากขาย",sumOf("sales")]].forEach(function(r){
    h+='<button data-v="'+r[0]+'">'+ICONS[r[0]]+'<span class="slbl">'+r[1]+'</span>'+
       (r[2]!=null?'<span class="cnt num">'+r[2]+'</span>':'')+'</button>';
  });
  var wroteP=false;
  h+='<div class="slab">ประเมินรายบุคคล</div>';
  D.staff.forEach(function(s){
    if(!s.core&&!wroteP){h+='<div class="slab">พาร์ทไทม์</div>';wroteP=true;}
    h+='<button data-v="p:'+esc(s.name)+'">'+
      '<span class="av" style="background:'+avIdx(s.name)+'">'+esc(ini(s.name))+'</span>'+
      '<span class="slbl">'+esc(s.name)+'</span>'+
      '<span class="cnt num">'+s.reports+'</span></button>';
  });
  document.getElementById("snav").innerHTML=h;
}

/* ══════ category block ══════ */
function catBlock(c,gk){
  var g=GROUPS[gk];
  var h='<details class="cat"><summary class="ch">'+CHEV+
    '<span class="cdot" style="background:'+g.c+'"></span>'+
    '<span class="cbody"><span class="ctitle">'+esc(c.label)+'</span>'+
    '<span class="cdesc">'+esc(c.desc)+'</span></span><span class="cright">';
  if(g.fix){
    if(c.recurred) h+=pill("b","แก้แล้วเกิดซ้ำ");
    else if(c.everFixed) h+=pill("g","แก้แล้ว");
    else h+=pill("n","ยังไม่มีบันทึกว่าแก้");
  }
  h+=pill(c.people>=3?"g":c.people===2?"w":"n",c.people+" คนเห็น")+
     '<span class="ccount num" style="color:'+g.c+'">'+c.total+'</span></span></summary>';
  h+='<div class="detail"><div class="meta">'+
    '<span>แจ้งครั้งแรก <b>'+th(c.first)+'</b></span>'+
    '<span>ครั้งล่าสุด <b>'+th(c.last)+'</b></span>';
  if(g.fix&&c.fixedOn) h+='<span>บันทึกว่าแก้แล้วเมื่อ <b>'+th(c.fixedOn)+'</b></span>';
  var who=Object.keys(c.who).sort(function(a,b){return c.who[b]-c.who[a];})
    .map(function(n){return esc(n)+" "+c.who[n];}).join(" · ");
  h+='<span>ผู้รายงาน <b>'+who+'</b></span></div>';
  if(g.fix&&c.recurred){
    h+='<div class="note b" style="margin:10px 0 2px"><b>เรื่องนี้เคยแก้แล้วแต่กลับมาอีก</b>'+
      'มีบันทึกว่าแก้ไขเมื่อ '+th(c.fixedOn)+' แต่ยังมีรายงานเรื่องเดิมเข้ามาหลังจากนั้น '+
      'อ่านข้อความด้านล่างเรียงจากใหม่ไปเก่าเพื่อดูว่าซ้ำตรงจุดไหน</div>';
  }
  c.items.forEach(function(it){
    h+='<div class="quote"><div class="qh"><span class="qn">'+esc(it.name)+'</span>'+
      '<span class="num" style="font-weight:500">'+th(it.date)+'</span>'+
      (it.fixed?pill("g","ระบุว่าแก้แล้ว"):'')+'</div>'+
      '<div class="qt">'+esc(it.text)+'</div></div>';
  });
  h+='</div></details>';
  return h;
}

/* ══════ ภาพรวม ══════ */
function vSum(){
  var sys=sumOf("system"),per=sumOf("person"),cus=sumOf("customer"),sal=sumOf("sales");
  var recur=D.groups.system.filter(function(c){return c.recurred;});
  var core=D.staff.filter(function(s){return s.core;});
  var teamRate=Math.round(core.reduce(function(s,x){return s+x.days;},0)/
    core.reduce(function(s,x){return s+x.span;},0)*100);

  var h='<h1 class="ph dsp">ภาพรวมสาขา</h1>'+
    '<p class="pd">แยกสิ่งที่พนักงานรายงานเข้ามาออกเป็นสี่กลุ่ม เพื่อให้เห็นว่าเรื่องไหนเป็นปัญหาของระบบ'+
    'ที่พนักงานแก้เองไม่ได้ และเรื่องไหนคือสิ่งที่ใช้ประเมินตัวบุคคลได้จริง</p>';

  var ms=D.months.slice(-6),mx=Math.max.apply(null,ms.map(function(m){return m.n;}).concat([1]));
  var allG=sys+per+cus+sal||1;
  h+='<div class="tiles">'+
   tile("p",Math.min(100,D.silentDays/14*100),D.silentDays,"วัน",
        "ไม่มีรายงานติดต่อกัน","ล่าสุด "+th(D.lastDate))+
   tile("a",sys/allG*100,sys,"ครั้ง",
        "เรื่องระบบและโครงสร้าง",Math.round(sys/allG*100)+"% ของทั้งหมด")+
   tile("c",per/allG*100,per,"ครั้ง",
        "ความผิดพลาดของคน",Math.round(per/allG*100)+"% ของทั้งหมด")+
   tile("v",sal/allG*100,sal,"ครั้ง",
        "สัญญาณความอยากขาย","รับมือลูกค้าอีก "+cus+" ครั้ง")+
  '</div>';

  if(recur.length){
    h+='<div class="note b"><b>มี '+recur.length+' เรื่องที่แก้แล้วแต่กลับมาเกิดซ้ำ</b>'+
      recur.map(function(c){return esc(c.label);}).join(" · ")+
      ' — เรื่องกลุ่มนี้พนักงานแก้เองไม่ได้ หน้าที่ของรายงานคือบอกว่ามันกลับมาอีกแล้ว '+
      'เปิดเมนู “ระบบและโครงสร้าง” เพื่ออ่านว่าซ้ำตรงจุดไหน</div>';
  }

  h+='<div class="g2"><div class="panel"><h2>สี่กลุ่มนี้อ่านต่างกันอย่างไร</h2>'+
    '<p class="cap">ตัวเลขเดียวกันมีความหมายไม่เหมือนกัน ขึ้นกับว่าอยู่ในกลุ่มไหน</p>';
  [["system","ระบบและโครงสร้าง",sys,"var(--amber)",
    "อาคาร อุปกรณ์ ของใช้ สัตว์รบกวน และเครื่องคิดเงิน — พนักงานแก้เองไม่ได้ สิ่งที่ต้องดูคือเกิดซ้ำหลังแก้แล้วหรือไม่"],
   ["person","ความผิดพลาดของคน",per,"var(--bad)",
    "ชงผิด จำสูตรไม่ได้ ลืมขั้นตอน — ใช้ประเมินตัวบุคคลได้ แต่ต้องอ่านคู่กับจำนวนรายงาน"],
   ["customer","การรับมือลูกค้า",cus,"var(--cyan)",
    "ตอบคำถาม รับคำติ และตัดสินใจเองหน้างาน — บอกว่าใครกล้าเผชิญหน้าและใครหลบ"],
   ["sales","ความอยากขาย",sal,"var(--violet)",
    "ถามความเห็นลูกค้า ทักลูกค้าประจำ เชียร์เมนู และเสนอไอเดียเพิ่มยอด"]].forEach(function(r){
    h+='<div class="rowline"><span class="rl"><b style="color:'+r[3]+'">'+r[1]+'</b><br>'+r[4]+
       '</span><span class="rv num" style="color:'+r[3]+';font-size:17px">'+r[2]+'</span></div>';
  });
  h+='</div>';

  h+='<div class="panel"><h2>แนวโน้มจำนวนรายงาน</h2>'+
     '<p class="cap">วงแหวนแต่ละวงคือหนึ่งเดือน · ความเต็มของวงเทียบกับเดือนที่มากที่สุด ('+mx+' ฉบับ)</p>'+
     '<div class="ringrow">';
  ms.forEach(function(m){
    var mi=(+m.k.split("-")[1])-1, p=m.n/mx*100;
    h+='<div class="rw">'+ring(p,m.n,"ฉบับ",p>=70?"var(--pink)":p>=35?"var(--violet)":"var(--bad)")+
      '<div class="rl">'+THM[mi]+'</div></div>';
  });
  h+='</div></div></div>';

  h+='<div class="panel"><h2>อัตราการส่งรายงาน</h2>'+
    '<p class="cap">นับเป็นจำนวนวันที่มีรายงาน ไม่ใช่จำนวนฉบับ · '+
    'กดชื่อเพื่อเปิดหน้าประเมินรายบุคคล · พาร์ทไทม์ไม่นับรวมในอัตราของทีม</p>'+
    '<div class="scroll"><table><thead><tr><th>พนักงาน</th><th>รายงาน</th><th>วันที่ส่ง</th>'+
    '<th>อัตรา</th><th>ความอยากขาย/ฉบับ</th><th>ส่งล่าสุด</th></tr></thead><tbody>';
  var gc=false,gp=false;
  D.staff.forEach(function(s){
    if(s.core&&!gc){h+='<tr class="grp"><td colspan="6">พนักงานประจำ</td></tr>';gc=true;}
    if(!s.core&&!gp){h+='<tr class="grp"><td colspan="6">พาร์ทไทม์ — ไม่นับอัตราการส่ง</td></tr>';gp=true;}
    h+='<tr><td class="who"><button class="lnk" data-go="p:'+esc(s.name)+'">'+esc(s.name)+'</button></td>'+
      '<td class="num">'+s.reports+'</td><td class="num">'+s.days+' / '+s.span+'</td>'+
      '<td>'+(s.core?bar(s.rate,rcol(s.rate))+'<b class="num">'+s.rate+'%</b>':pill("i","ส่งเสริม"))+'</td>'+
      '<td class="num">'+s.salesPerReport.toFixed(2)+'</td>'+
      '<td>'+th(s.last)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+=matrix();
  return h;
}

/* ══════ comparison matrix — 3 core staff ══════ */
function matrix(){
  var C=D.staff.filter(function(s){return s.core;});
  if(C.length<2) return '';
  var P=D.staff.filter(function(s){return !s.core;});

  function mx(f){return Math.max.apply(null,C.map(f).concat([0.0001]));}
  var mChars=mx(function(s){return s.avgChars;}),
      mSales=mx(function(s){return s.salesPerReport;}),
      mCust =mx(function(s){return s.custHandle/s.reports;}),
      mErr  =mx(function(s){return s.errPerReport;}),
      mSys  =mx(function(s){return forName("system",s.name)/s.reports;});

  var h='<h2 class="dsp" style="font-size:19px;margin:30px 0 5px">เทียบพนักงานประจำ 3 คน</h2>'+
    '<p class="pd">อ่านจากบนลงล่างทีละหมวด วงแหวนยิ่งเต็มยิ่งสูงเมื่อเทียบกันในกลุ่ม · '+
    'กดชื่อเพื่อเปิดหน้าประเมินฉบับเต็มของแต่ละคน</p><div class="mx">';

  /* header row */
  h+='<div class="rowlab" style="background:var(--surface)"></div>';
  C.forEach(function(s){
    h+='<div class="mxhead pcol" style="--pc:'+avSolid(s.name)+'">'+
      '<div class="mav" style="background:'+avIdx(s.name)+'">'+
      esc(ini(s.name))+'</div>'+
      '<button class="lnk mnm" data-go="p:'+esc(s.name)+'" style="text-decoration:none">'+
      esc(s.name)+'</button>'+
      '<div class="mdt">เริ่ม '+th(s.first)+'<br>ล่าสุด '+th(s.last)+'</div></div>';
  });

  function row(label,desc,fn){
    h+='<div class="rowlab"><div class="rt">'+label+'</div><div class="rd">'+desc+'</div></div>';
    var vals=C.map(fn), top=Math.max.apply(null,vals.map(function(v){return v.raw;}));
    vals.forEach(function(v,i){
      var pc=avSolid(C[i].name);
      h+=ringCell(v.pct,v.center,v.sub,pc,v.raw===top&&top>0,pc);
    });
  }

  row('อัตราการส่งรายงาน','จำนวนวันที่ส่ง เทียบกับวันที่ทำงานทั้งหมด',function(s){
    return {pct:s.rate,center:s.rate+'%',sub:s.days+'/'+s.span+' วัน',raw:s.rate};
  });
  row('ความละเอียดการเขียน','ตัวอักษรเฉลี่ยต่อรายงานหนึ่งฉบับ',function(s){
    return {pct:s.avgChars/mChars*100,center:s.avgChars.toLocaleString(),sub:'ตัวอักษร',
      raw:s.avgChars};
  });
  row('ความอยากขาย','ถามความเห็นลูกค้า ทักลูกค้าประจำ เชียร์เมนู — ต่อหนึ่งฉบับ',function(s){
    return {pct:s.salesPerReport/mSales*100,center:s.salesPerReport.toFixed(2),sub:'ต่อฉบับ',
      raw:s.salesPerReport};
  });
  row('การรับมือลูกค้า','ตอบคำถาม รับคำติ ตัดสินใจหน้างาน — ต่อหนึ่งฉบับ',function(s){
    var r=s.custHandle/s.reports;
    return {pct:r/mCust*100,center:r.toFixed(2),sub:'ต่อฉบับ',raw:r};
  });
  row('เป็นหูเป็นตาเรื่องระบบ','แจ้งปัญหาอาคาร อุปกรณ์ ของใช้ — ต่อหนึ่งฉบับ',function(s){
    var r=forName("system",s.name)/s.reports;
    return {pct:r/mSys*100,center:r.toFixed(2),sub:'ต่อฉบับ',raw:r};
  });
  row('กล้ารายงานความผิดตัวเอง','ยิ่งสูงยิ่งซื่อตรง ไม่ได้แปลว่าทำงานแย่กว่า',function(s){
    return {pct:s.errPerReport/mErr*100,center:s.errPerReport.toFixed(2),sub:'ต่อฉบับ',
      raw:s.errPerReport};
  });

  /* composition row */
  h+='<div class="rowlab"><div class="rt">สัดส่วนสี่กลุ่ม</div>'+
     '<div class="rd">ทั้งหมดที่คนนั้นรายงาน แบ่งเป็นสี่กลุ่ม</div></div>';
  C.forEach(function(s){
    var m=[{c:"var(--amber)",v:forName("system",s.name)},
           {c:"var(--bad)",v:forName("person",s.name)},
           {c:"var(--cyan)",v:forName("customer",s.name)},
           {c:"var(--violet)",v:forName("sales",s.name)}];
    h+='<div class="pcol" style="--pc:'+avSolid(s.name)+'">'+donut(m,96)+'</div>';
  });
  h+='</div>';

  h+='<div class="note i" style="margin-top:14px"><b>ทำไมใช้ตัวเลขต่อฉบับ</b>'+
    'เพราะแต่ละคนส่งรายงานไม่เท่ากัน การนับจำนวนครั้งดิบ ๆ จะทำให้คนที่ส่งบ่อยได้เปรียบเสมอ '+
    'ตัวเลขต่อฉบับบอกว่า “ทุกครั้งที่เขาเขียนรายงาน เขาใส่เรื่องนั้นมาบ่อยแค่ไหน” '+
    'ซึ่งเทียบกันได้อย่างเป็นธรรม ยกเว้นแถวอัตราการส่ง ที่วัดความสม่ำเสมอโดยตรง</div>';

  if(P.length){
    h+='<div class="panel" style="margin-top:14px"><h2>พนักงานพาร์ทไทม์</h2>'+
      '<p class="cap">ช่วยบางช่วงเวลา ไม่นับรวมในอัตราของทีม การส่งรายงานถือเป็นข้อดีเพิ่มเติม '+
      '· กดชื่อเพื่อเปิดหน้าของแต่ละคน</p><div class="ringrow" style="justify-content:flex-start">';
    P.forEach(function(s){
      var tot=["system","person","customer","sales"].reduce(function(t,g){return t+forName(g,s.name);},0);
      h+='<div class="rw" style="min-width:120px">'+
        '<button class="lnk" data-go="p:'+esc(s.name)+'" style="text-decoration:none;display:block">'+
        ring(Math.min(100,s.reports/10*100),s.reports,"ฉบับ",avSolid(s.name))+
        '<div class="rl" style="font-size:13.5px;font-weight:700;color:var(--ink);margin-top:6px">'+
        esc(s.name)+'</div>'+
        '<div class="rl">'+tot+' รายการ · ล่าสุด '+th(s.last)+'</div></button></div>';
    });
    h+='</div></div>';
  }
  return h;
}

/* ══════ group page ══════ */
function vGroup(k){
  var g=GROUPS[k],cats=D.groups[k];
  var h='<h1 class="ph dsp">'+g.t+'</h1><p class="pd">'+g.d+
    ' · กดที่แต่ละหัวข้อเพื่ออ่านข้อความจริงที่พนักงานเขียนเข้ามา</p>';
  if(k==="system") h+='<div class="note i"><b>“ระบบขายหน้าร้าน” หมายถึงอะไร</b>'+
    'คือเครื่องคิดเงินและระบบตัดยอดขายหน้าร้าน ครอบคลุมการคีย์บิล การใช้คูปอง การสแกนจ่าย '+
    'และเครื่องพิมพ์ใบเสร็จ — เป็นระบบที่ร้านติดตั้งไว้ พนักงานแก้เองไม่ได้ '+
    'เมื่อมีปัญหาจะกระทบทั้งความเร็วในการให้บริการและความถูกต้องของยอดขาย</div>';
  if(k==="person") h+='<div class="note w"><b>อ่านตัวเลขกลุ่มนี้อย่างไรให้ไม่ผิด</b>'+
    'ตัวเลขนี้คือจำนวนครั้งที่พนักงาน<b>รายงานข้อผิดพลาดของตัวเอง</b> ไม่ใช่จำนวนข้อผิดพลาดที่เกิดขึ้นจริง '+
    'คนที่ได้ศูนย์อาจแปลว่าไม่ผิดพลาด หรืออาจแปลว่าไม่รายงานก็ได้ '+
    'ต้องอ่านคู่กับจำนวนรายงานทั้งหมดของคนนั้นเสมอ</div>';
  if(k==="sales") h+='<div class="note v"><b>วัดความอยากขายจากอะไร</b>'+
    'จากสิ่งที่พนักงานทำเองโดยไม่มีใครสั่ง ได้แก่ เข้าไปถามลูกค้าว่ารสชาติเป็นอย่างไร '+
    'ทักลูกค้าประจำด้วยเมนูเดิมก่อนที่ลูกค้าจะสั่ง เชียร์เมนูเพิ่ม สังเกตว่าเมนูไหนขายไม่ออก '+
    'และเสนอเมนูใหม่ที่ลูกค้าถามหา</div>';
  if(!cats.length) return h+'<div class="panel"><div class="empty">ยังไม่พบรายการในกลุ่มนี้</div></div>';
  cats.forEach(function(c){h+=catBlock(c,k);});
  if(k==="system"){
    var rec=cats.filter(function(c){return c.recurred;}),
        un=cats.filter(function(c){return !c.everFixed;});
    h+='<div class="panel" style="margin-top:16px"><h2>สรุปสถานะเรื่องของระบบ</h2>'+
      '<p class="cap">สิ่งที่ผู้บริหารต้องตัดสินใจ</p>';

      '<br>กลุ่มนี้คือเรื่องที่การแก้ครั้งก่อนยังไม่ถาวร ควรดูว่าแก้ที่ต้นเหตุหรือแก้เฉพาะหน้า</div>';
    if(un.length)h+='<div class="note w"><b>ยังไม่มีบันทึกว่าแก้ — '+un.length+' เรื่อง</b>'+

    h+='</div>';
  }

/* ══════ person page ══════ */
function donut(vals,size){
  size=size||132;
  var tot=vals.reduce(function(a,b){return a+b.v;},0)||1, off=0, R=52, C=2*Math.PI*R;
  var s='<svg width="'+size+'" height="'+size+'" viewBox="0 0 132 132" role="img" '+
    'aria-label="สัดส่วนสี่กลุ่ม"><g transform="rotate(-90 66 66)">';
  s+='<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="var(--sink)" stroke-width="17"/>';
  vals.forEach(function(x){
    if(!x.v) return;
    var len=x.v/tot*C;
    s+='<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+x.c+'" stroke-width="17" '+
      'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" '+
      'stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len;
  });
  s+='</g><text x="66" y="62" text-anchor="middle" font-family="Prompt" font-size="25" '+
    'font-weight="700" fill="var(--ink)">'+tot+'</text>'+
    '<text x="66" y="80" text-anchor="middle" font-family="Noto Sans Thai" font-size="11" '+
    'fill="var(--mid)">รายการ</text></svg>';
  return s;
}

function ring(pct,center,sub,color,size){
  size=size||92;
  var R=38,C=2*Math.PI*R,len=Math.max(0,Math.min(100,pct))/100*C;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 92 92" '+
    'role="img" aria-label="'+esc(sub||"")+' '+esc(String(center))+'">'+
    '<circle cx="46" cy="46" r="'+R+'" fill="none" stroke="var(--sink)" stroke-width="9"/>'+
    '<g transform="rotate(-90 46 46)"><circle cx="46" cy="46" r="'+R+'" fill="none" '+
    'stroke="'+color+'" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/></g>'+
    '<text class="rv" x="46" y="'+(sub?44:52)+'" text-anchor="middle" font-size="'+
    (String(center).length>4?15:19)+'">'+esc(String(center))+'</text>'+
    (sub?'<text class="rs" x="46" y="60" text-anchor="middle" font-size="10">'+esc(sub)+'</text>':'')+
    '</svg>';
}
function gauge(pct,center,sub){
  var R=38,C=2*Math.PI*R,len=Math.max(0,Math.min(100,pct))/100*C;
  var fs=String(center).length>5?17:String(center).length>3?21:26;
  return '<svg class="gauge" width="104" height="104" viewBox="0 0 92 92" aria-hidden="true">'+
    '<circle cx="46" cy="46" r="'+R+'" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="8"/>'+
    '<g transform="rotate(-90 46 46)"><circle cx="46" cy="46" r="'+R+'" fill="none" '+
    'stroke="#fff" stroke-width="8" stroke-linecap="round" '+
    'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/></g>'+
    '<text class="gv" x="46" y="'+(sub?45:53)+'" text-anchor="middle" font-size="'+fs+'">'+
    esc(String(center))+'</text>'+
    (sub?'<text class="gs" x="46" y="61" text-anchor="middle" font-size="10.5">'+esc(sub)+'</text>':'')+
    '</svg>';
}
function tile(cls,pct,center,unit,title,sub){
  return '<div class="tile '+cls+'">'+gauge(pct,center,unit)+
    '<div><div class="tk">'+title+'</div><div class="ts">'+sub+'</div></div></div>';
}

function ringCell(pct,center,sub,color,best,pc){
  return '<div class="pcol" style="--pc:'+pc+'">'+ring(pct,center,sub,color)+
    (best?'<div class="mxwin">สูงสุดในกลุ่ม</div>':'')+'</div>';
}

/* ══════ กล่องข้อมูลลับ — ถอดรหัสด้วยรหัสผ่าน (AES-GCM) ══════ */
var VAULT=null;
function b64b(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function openVault(pw){
  if(!D.vault) throw new Error("ไฟล์นี้ไม่มีข้อมูลลับแนบมา");
  var raw=b64b(D.vault), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
    {name:"PBKDF2"},false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:D.vaultIter||150000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  VAULT=JSON.parse(new TextDecoder().decode(plain));
  return VAULT;
}
async function askUnlock(msgEl){
  var pw=prompt("ใส่รหัสผ่านผู้บริหาร เพื่อเปิดอ่านข้อความต้นฉบับ");
  if(pw===null) return false;
  try{ await openVault(pw);
    if(msgEl){msgEl.textContent="ปลดล็อกแล้ว";msgEl.style.color="var(--good)";}
    render(); return true;
  }catch(e){
    if(msgEl){msgEl.textContent="รหัสผ่านไม่ถูกต้อง";msgEl.style.color="var(--bad)";}
    else alert("รหัสผ่านไม่ถูกต้อง");
    return false;
  }
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest&&ev.target.closest(".unlockbtn");
  if(b){ev.preventDefault();askUnlock(null);}
});


/* ══════ ปัญหารอการแก้ไข ══════ */
function vOpen(){
  var cats=(D.groups.system||[]).slice();
  function st(c){
    if(c.recurred) return 2;                 // แก้แล้วแต่กลับมา
    if(c.everFixed) return 3;                // แก้แล้ว
    return 1;                                // ยังไม่มีบันทึกว่าแก้
  }
  function age(c){return Math.round((new Date(D.lastDate)-new Date(c.first))/864e5);}
  cats.sort(function(a,b){return st(a)-st(b)||age(b)-age(a);});
  var openN=cats.filter(function(c){return st(c)<3;}).length;

  var h='<h1 class="ph dsp">ปัญหารอการแก้ไข</h1>'+
    '<p class="pd">เรื่องที่พนักงานแจ้งเข้ามาแล้วยังไม่มีบันทึกว่าแก้ไขแล้ว '+
    'เรียงจากเรื่องที่ค้างนานที่สุด · ใช้ดูว่าอะไรควรรีบ อะไรปล่อยคาไว้ได้</p>';

  if(!cats.length) return h+'<div class="panel"><div class="empty">ยังไม่มีเรื่องที่แจ้งเข้ามา</div></div>';

  h+='<div class="tiles">'+
    tile("a",openN/Math.max(1,cats.length)*100,openN,"เรื่อง","ยังค้างอยู่",
         "จากทั้งหมด "+cats.length+" เรื่อง")+
    tile("p",Math.min(100,age(cats[0])/90*100),age(cats[0]),"วัน","ค้างนานที่สุด",
         cats[0].label)+
    tile("c",100,cats.filter(function(c){return st(c)===3;}).length,"เรื่อง",
         "บันทึกว่าแก้แล้ว","ไม่กลับมาอีก")+
    tile("v",100,cats.filter(function(c){return c.recurred;}).length,"เรื่อง",
         "แก้แล้วกลับมาอีก","ต้องดูที่ต้นเหตุ")+
  '</div>';

  h+='<div class="panel"><h2>รายการทั้งหมด</h2>'+
    '<p class="cap">กดที่แต่ละเรื่องเพื่ออ่านข้อความจริงที่พนักงานเขียนเข้ามา</p>'+
    '<div class="scroll"><table><thead><tr><th>เรื่อง</th><th>สถานะ</th>'+
    '<th>แจ้งครั้งแรก</th><th>ล่าสุด</th><th>ค้างมา</th><th>ครั้ง</th></tr></thead><tbody>';
  cats.forEach(function(c){
    var s=st(c);
    h+='<tr><td class="who"><button class="lnk" data-go="system">'+esc(c.label)+'</button></td>'+
      '<td>'+(s===1?pill("b","ยังไม่แก้"):s===2?pill("w","แก้แล้วกลับมาอีก"):pill("g","แก้แล้ว"))+'</td>'+
      '<td>'+th(c.first)+'</td><td>'+th(c.last)+'</td>'+
      '<td class="num">'+age(c)+' วัน</td><td class="num">'+c.total+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  cats.forEach(function(c){ if(st(c)<3) h+=catBlock(c,"system"); });
  return h;
}


/* ══════ ของที่น้องขอ ══════ */
function vReq(){
  var R=D.requests||[];
  var h='<h1 class="ph dsp">ของที่น้องขอ</h1>'+
    '<p class="pd">ทุกอย่างที่พนักงานเขียนขอเข้ามาในรายงาน แยกเป็นรายชิ้น '+
    'เรียงจากที่ขอบ่อยที่สุดและค้างนานที่สุด · ตัวเลข "ค้าง" นับจากวันที่ขอครั้งแรก</p>';
  if(!R.length) return h+'<div class="panel"><div class="empty">ยังไม่พบคำขอในรายงาน</div></div>';

  var open=R.filter(function(r){return !r.done;});
  var total=R.reduce(function(s,r){return s+r.count;},0);
  var maxd=Math.max.apply(null,R.map(function(r){return r.days;}));
  var rep=R.filter(function(r){return r.count>1;}).length;

  h+='<div class="tiles">'+
    tile("a",open.length/Math.max(1,R.length)*100,open.length,"รายการ",
         "ยังไม่มีบันทึกว่าได้","จากที่ขอมา "+R.length+" รายการ")+
    tile("p",Math.min(100,maxd/90*100),maxd,"วัน","ค้างนานที่สุด",
         R.filter(function(r){return r.days===maxd;})[0].item)+
    tile("c",100,total,"ครั้ง","จำนวนครั้งที่ขอรวม","นับทุกฉบับที่เขียนถึง")+
    tile("v",rep/Math.max(1,R.length)*100,rep,"รายการ","ขอซ้ำมากกว่า 1 ครั้ง",
         "แปลว่าครั้งแรกไม่ได้คำตอบ")+
  '</div>';

  h+='<div class="note w"><b>อ่านหน้านี้อย่างไร</b>'+
    'รายการที่ขอซ้ำหลายครั้งคือรายการที่พนักงานเคยแจ้งแล้วไม่มีอะไรเกิดขึ้น '+
    'จึงต้องกลับมาขออีก ยิ่งขอซ้ำบ่อยและค้างนาน ยิ่งบั่นทอนความเชื่อว่าการเขียนรายงานมีผล</div>';

  h+='<div class="panel"><h2>รายการทั้งหมด</h2>'+
     '<p class="cap">กดที่แต่ละรายการเพื่ออ่านข้อความจริงทุกครั้งที่เขียนขอ</p>';
  R.forEach(function(r){
    h+='<details class="rqrow '+(r.done?'fixed':'open')+'"><summary style="cursor:pointer">'+
      '<span class="rqh"><span class="rqn">'+esc(r.item)+'</span>'+
      '<span class="rqbig num" style="color:'+(r.done?'var(--good)':'var(--bad)')+'">'+
        r.days+'<span style="font-size:12px;font-weight:600"> วัน</span></span></span>'+
      '<span class="rqd">'+esc(r.desc)+'</span>'+
      '<span class="rqmeta">'+
        pill(r.done?"g":"b",r.done?"มีบันทึกว่าได้แล้ว":"ยังไม่มีบันทึกว่าได้")+
        pill(r.count>1?"w":"n","ขอ "+r.count+" ครั้ง")+
        pill("n","ครั้งแรก "+th(r.first))+
        pill("n","ล่าสุด "+th(r.last))+
        pill("i",r.people.map(esc).join(" · "))+
      '</span></summary><div class="rqq">';
    r.mentions.forEach(function(m){
      h+='<div class="qd">'+th(m.date)+' · '+esc(m.name)+'</div><p>'+esc(m.text)+'</p>';
    });
    h+='</div></details>';
  });
  h+='</div>';
  return h;
}

/* ══════ router ══════ */
var VIEW="sum";
function render(){
  var h,t,sub;
  if(VIEW.indexOf("p:")===0){
    var n=VIEW.slice(2); h=vPerson(n); t=esc(n); sub="ประเมินรายบุคคล";
  }else if(VIEW==="sum"){ h=vSum(); t="ภาพรวม"; sub="สรุปทั้งสาขา"; }
  else if(VIEW==="open"){ h=vOpen(); t="ปัญหารอการแก้ไข"; sub="เรื่องที่ยังไม่มีบันทึกว่าแก้"; }
  else if(VIEW==="req"){ h=vReq(); t="ของที่น้องขอ"; sub="คำขอจากหน้าร้าน แยกรายชิ้น"; }
  else { h=vGroup(VIEW); t=GROUPS[VIEW].t; sub="แยกตามหมวด กดเพื่ออ่านข้อความจริง"; }
  document.getElementById("tbT").innerHTML=t;
  document.getElementById("tbS").textContent=sub;
  h+='<div class="foot">Impress Coffee LP · วิเคราะห์จากรายงานประจำวัน '+D.totalReports+' ฉบับ '+
    'ช่วง '+th(D.firstDate)+' – '+th(D.lastDate)+'<br>'+
    'ข้อความทั้งหมดเป็นคำพูดของพนักงานตามที่เขียนเข้ามาจริง ไม่ได้เรียบเรียงใหม่ · '+
    'เอกสารนี้มีข้อมูลภายใน โปรดส่งต่อเฉพาะผู้ที่เกี่ยวข้อง</div>';
  document.getElementById("main").innerHTML=h;
  [].forEach.call(document.querySelectorAll("#snav button"),function(b){
    if(b.getAttribute("data-v")===VIEW) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
}
function go(v){ VIEW=v; render(); closeNav(); }
function closeNav(){
  document.getElementById("side").classList.remove("open");
  var s=document.querySelector(".scrim"); if(s) s.remove();
}
document.getElementById("snav").addEventListener("click",function(e){
  var b=e.target.closest("button[data-v]"); if(b) go(b.getAttribute("data-v"));
});
document.getElementById("main").addEventListener("click",function(e){
  var b=e.target.closest("button[data-go]"); if(b) go(b.getAttribute("data-go"));
});
document.getElementById("burger").addEventListener("click",function(){
  var a=document.getElementById("side");
  if(a.classList.contains("open")) return closeNav();
  a.classList.add("open");
  var sc=document.createElement("div"); sc.className="scrim";
  sc.addEventListener("click",closeNav); document.body.appendChild(sc);
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeNav(); });

document.getElementById("tbR").innerHTML =
  "ข้อมูล "+th(D.firstDate)+" – "+th(D.lastDate)+"<br>"+D.totalReports+" ฉบับ";
buildNav(); render();
</script>
